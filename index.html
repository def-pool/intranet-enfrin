<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intranet — Candidatures, Adzuna & Agent Qualification</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 16px; background: #f6f8fa; color: #111827; }
    h1 { margin-bottom: 20px; }
    h2 { margin-top: 0; font-size: 1.15rem; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 9px 14px; background: #0f766e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #115e59; }
    button.secondary { background: #2563eb; }
    button.secondary:hover { background: #1d4ed8; }
    button.qualif { background: #7c3aed; }
    button.qualif:hover { background: #6d28d9; }
    button.small { margin-top: 8px; margin-right: 8px; padding: 6px 10px; font-size: 0.9rem; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1 1 200px; }
    #message, #adzuna-status { margin-top: 12px; padding: 10px; border-radius: 4px; display: none; white-space: pre-wrap; }
    .ok { background: #dcfce7; color: #166534; display: block !important; }
    .err { background: #fee2e2; color: #991b1b; display: block !important; }
    .info { background: #e0f2fe; color: #075985; display: block !important; }
    .item, .offre { padding: 14px; border-bottom: 1px solid #eee; }
    .item:last-child, .offre:last-child { border-bottom: none; }
    .offre-titre { font-weight: bold; font-size: 1.02rem; }
    .offre-meta { color: #4b5563; font-size: 0.9rem; margin-top: 4px; }
    .offre-desc { color: #374151; font-size: 0.88rem; margin-top: 6px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: bold; margin-left: 8px; }
    .b-high { background: #dcfce7; color: #166534; }
    .b-mid { background: #fef3c7; color: #92400e; }
    .b-low { background: #f3f4f6; color: #374151; }
    .qualif-box { margin-top: 10px; padding: 10px; background: #f9fafb; border-left: 3px solid #7c3aed; border-radius: 4px; font-size: 0.9rem; }
    textarea.msg-out { margin-top: 6px; font-size: 0.85rem; background: #fff; }
    a { color: #0f766e; }
  </style>
</head>
<body>
  <h1>Intranet — Candidatures, Adzuna & Agent Qualification</h1>

  <!-- BLOC 1 : RECHERCHE ADZUNA -->
  <div class="card">
    <h2>1. Rechercher et qualifier des offres via Adzuna</h2>
    <form id="form-adzuna">
      <div class="row">
        <div>
          <label for="adzuna-query">Mots-clés *</label>
          <input id="adzuna-query" type="text" required value="responsable commercial b2b" placeholder="Ex. responsable commercial, traitement eau..." />
        </div>
        <div>
          <label for="adzuna-country">Pays</label>
          <select id="adzuna-country">
            <option value="fr" selected>France (FR)</option>
            <option value="es">Espagne (ES)</option>
            <option value="be">Belgique (BE)</option>
            <option value="ch">Suisse (CH)</option>
          </select>
        </div>
      </div>
      <button type="submit" class="secondary">Rechercher sur Adzuna</button>
    </form>
    <div id="adzuna-status"></div>
    <div id="resultats-adzuna" style="margin-top: 14px;"></div>
  </div>

  <!-- BLOC 2 : AJOUT MANUEL DE CANDIDATURE -->
  <div class="card">
    <h2>2. Ajouter une candidature manuellement</h2>
    <form id="form-candidature">
      <label for="poste">Intitulé du poste *</label>
      <input id="poste" type="text" required placeholder="Ex. Responsable Commercial B2B" />

      <label for="entreprise">Entreprise *</label>
      <input id="entreprise" type="text" required placeholder="Ex. Exemple Industrie" />

      <label for="localisation">Localisation</label>
      <input id="localisation" type="text" placeholder="Ex. France / Itinérant" />

      <label for="lien_offre">Lien de l'offre</label>
      <input id="lien_offre" type="url" placeholder="https://..." />

      <label for="statut">Statut</label>
      <select id="statut">
        <option value="a_postuler">À postuler</option>
        <option value="postule">Postulé</option>
        <option value="relance">Relance</option>
        <option value="entretien">Entretien</option>
      </select>

      <label for="notes">Description / Notes (utilisées aussi pour le score)</label>
      <textarea id="notes" rows="3" placeholder="Informations utiles, missions, secteur..."></textarea>

      <button type="submit">Enregistrer dans Supabase</button>
    </form>
    <div id="message"></div>
  </div>

  <!-- BLOC 3 : LISTE SUPABASE -->
  <div class="card">
    <h2>3. Dernières candidatures enregistrées</h2>
    <div id="liste">Chargement...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://cftqeuzcddyxyrxutjwd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7Lbz8CO9IoUng0DOejAY5Q_aFM-3mvh";

    const msgBox = document.getElementById("message");
    const adzunaStatus = document.getElementById("adzuna-status");
    const resultatsAdzunaEl = document.getElementById("resultats-adzuna");
    const listeEl = document.getElementById("liste");
    const form = document.getElementById("form-candidature");
    const formAdzuna = document.getElementById("form-adzuna");

    let dernieresOffresAdzuna = [];

    function afficherMessage(texte, estErreur = false) {
      msgBox.textContent = texte;
      msgBox.className = estErreur ? "err" : "ok";
    }

    function afficherStatutAdzuna(texte, type = "info") {
      adzunaStatus.textContent = texte;
      adzunaStatus.className = type;
    }

    if (!window.supabase || !window.supabase.createClient) {
      afficherMessage("Erreur : la bibliothèque Supabase ne s'est pas chargée.", true);
    }

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // AGENT DE QUALIFICATION NIVEAU 1 (Règles B2B Eau / Piscine / Direction / Export)
    function qualifierOffre(offre, pays = "fr") {
      const texte = `${offre.poste || ""} ${offre.entreprise || ""} ${offre.localisation || ""} ${offre.description || ""}`.toLowerCase();
      let score = 35;
      const pointsForts = [];
      const pointsVigilance = [];

      const regles = [
        { poids: 20, label: "Poste B2B / Direction / Développement", mots: ["b2b", "responsable commercial", "business developer", "key account", "area sales", "directeur", "export"] },
        { poids: 20, label: "Secteur Eau / Piscine / Spa / Hydraulique", mots: ["piscine", "pool", "spa", "traitement de l'eau", "eau", "hydraulique", "pompage", "pompe", "irrigation", "filtration", "chimie"] },
        { poids: 10, label: "Dimension Technique / Réseau / SAV", mots: ["technique", "technico-commercial", "réseau", "reseau", "franchise", "distributeur", "sav", "réglementaire", "conformité"] },
        { poids: 10, label: "Périmètre France / Espagne / Europe", mots: ["france", "espagne", "spain", "europe", "emea", "itinérant", "itinerant", "national"] },
        { poids: 5,  label: "Langues FR / EN / ES", mots: ["anglais", "english", "espagnol", "spanish", "bilingue", "trilingue"] }
      ];

      for (const r of regles) {
        if (r.mots.some(m => texte.includes(m))) {
          score += r.poids;
          pointsForts.push(r.label);
        }
      }

      if (["stage", "alternance", "apprentissage", "stagiaire", "caissier", "vendeur magasin", "b2c"].some(m => texte.includes(m))) {
        score -= 35;
        pointsVigilance.push("Critère hors cible détecté (stage, alternance ou B2C pur)");
      }

      score = Math.max(5, Math.min(100, score));

      const estEspagnol = pays === "es" || /\b(españa|madrid|barcelona|valencia|comercial|responsable)\b/.test(texte);
      const messageApproche = estEspagnol
        ? `Hola, he visto la posición de ${offre.poste} en ${offre.entreprise}. Cuento con más de 20 años de experiencia en desarrollo comercial B2B, gestión de redes y equipos, y tratamiento de agua/equipamiento técnico entre Francia, España y Europa. ¿Le parece que conversemos brevemente sobre cómo puedo aportar valor a su crecimiento?`
        : `Bonjour, j'ai repéré le poste de ${offre.poste} chez ${offre.entreprise}. Fort de plus de 20 ans d'expérience en développement commercial B2B, structuration de réseaux/comptes clés et équipements techniques/traitement de l'eau sur la France et l'Europe, j'aimerais échanger avec vous sur l'apport concret de mon profil à vos objectifs.`;

      const synthese = pointsForts.length > 0
        ? `Critères alignés : ${pointsForts.join(" ; ")}.${pointsVigilance.length ? " Vigilance : " + pointsVigilance.join(" ; ") + "." : ""}`
        : "Correspondance partielle à vérifier dans le détail de la fiche de poste.";

      return { score, synthese, messageApproche };
    }

    function badgeScore(score) {
      if (score >= 70) return `<span class="badge b-high">Score : ${score}/100</span>`;
      if (score >= 50) return `<span class="badge b-mid">Score : ${score}/100</span>`;
      return `<span class="badge b-low">Score : ${score}/100</span>`;
    }

    async function chargerCandidatures() {
      try {
        const { data, error } = await supabaseClient
          .from("candidatures")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(15);

        if (error) {
          listeEl.innerHTML = `<p style="color:#991b1b;">Erreur lecture : ${error.message}</p>`;
          return;
        }

        if (!data || data.length === 0) {
          listeEl.innerHTML = "<p>Aucune candidature enregistrée pour le moment.</p>";
          return;
        }

        listeEl.innerHTML = data.map(row => `
          <div class="item">
            <strong>${row.poste || "(Sans poste)"}</strong> — ${row.entreprise || "(Sans entreprise)"}
            ${typeof row.score_match === "number" ? badgeScore(row.score_match) : ""}<br>
            <small>Statut : ${row.statut || "-"} | ${row.localisation || ""} | Source : ${row.source || "manuel"}</small>
            ${row.lien_offre ? `<br><small><a href="${row.lien_offre}" target="_blank" rel="noopener noreferrer">Voir l'offre</a></small>` : ""}
            ${row.message_approche ? `<br><small><em>Message prêt :</em> ${row.message_approche}</small>` : ""}
          </div>
        `).join("");
      } catch (err) {
        listeEl.innerHTML = `<p style="color:#991b1b;">Erreur inattendue : ${err.message || err}</p>`;
      }
    }

    async function insererCandidature(payload) {
      const { error } = await supabaseClient
        .from("candidatures")
        .insert([payload]);

      if (error) {
        // Repli si score_match ou message_approche n'existent pas encore dans la table
        if (error.message && (error.message.includes("score_match") || error.message.includes("message_approche"))) {
          const copie = { ...payload };
          delete copie.score_match;
          delete copie.message_approche;
          const retry = await supabaseClient.from("candidatures").insert([copie]);
          if (retry.error) throw new Error(retry.error.message);
        } else {
          throw new Error(error.message);
        }
      }
      await chargerCandidatures();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      afficherMessage("Enregistrement en cours...", false);

      try {
        const poste = document.getElementById("poste").value.trim();
        const entreprise = document.getElementById("entreprise").value.trim();
        const localisation = document.getElementById("localisation").value.trim() || null;
        const notes = document.getElementById("notes").value.trim() || null;
        const qualif = qualifierOffre({ poste, entreprise, localisation, description: notes || "" }, "fr");

        await insererCandidature({
          poste,
          entreprise,
          localisation,
          lien_offre: document.getElementById("lien_offre").value.trim() || null,
          statut: document.getElementById("statut").value,
          notes,
          source: "manuel",
          score_match: qualif.score,
          message_approche: qualif.messageApproche
        });

        afficherMessage(`Candidature enregistrée avec succès ! (Score : ${qualif.score}/100)`, false);
        form.reset();
      } catch (err) {
        afficherMessage("Erreur d'enregistrement : " + (err.message || err), true);
      }
    });

    function rendreOffresAdzuna(offres) {
      if (!offres || offres.length === 0) {
        resultatsAdzunaEl.innerHTML = "<p>Aucune offre trouvée pour ces critères.</p>";
        return;
      }

      resultatsAdzunaEl.innerHTML = offres.map((offre, index) => `
        <div class="offre">
          <div class="offre-titre">
            ${offre.poste}
            <span id="badge-${index}"></span>
          </div>
          <div class="offre-meta">${offre.entreprise} — ${offre.localisation}</div>
          ${offre.description ? `<div class="offre-desc">${offre.description.slice(0, 240)}...</div>` : ""}
          <div style="margin-top: 8px;">
            ${offre.lien_offre ? `<a href="${offre.lien_offre}" target="_blank" rel="noopener noreferrer">Ouvrir l'annonce</a>` : ""}
            <button type="button" class="qualif small" onclick="qualifierLigne(${index})">Qualifier (Agent Niveau 1)</button>
            <button type="button" class="small" onclick="ajouterOffreAdzuna(${index})">Ajouter aux candidatures</button>
          </div>
          <div id="qualif-${index}" style="display:none;"></div>
        </div>
      `).join("");
    }

    window.qualifierLigne = function(index) {
      const offre = dernieresOffresAdzuna[index];
      if (!offre) return;
      const pays = document.getElementById("adzuna-country").value;
      const res = qualifierOffre(offre, pays);
      offre._qualif = res;

      document.getElementById(`badge-${index}`).innerHTML = badgeScore(res.score);
      const box = document.getElementById(`qualif-${index}`);
      box.style.display = "block";
      box.className = "qualif-box";
      box.innerHTML = `
        <div><strong>Synthèse :</strong> ${res.synthese}</div>
        <div style="margin-top: 6px;"><strong>Message d'approche proposé :</strong></div>
        <textarea class="msg-out" rows="3" readonly>${res.messageApproche}</textarea>
      `;
    };

    window.ajouterOffreAdzuna = async function(index) {
      const offre = dernieresOffresAdzuna[index];
      if (!offre) return;

      const pays = document.getElementById("adzuna-country").value;
      const qualif = offre._qualif || qualifierOffre(offre, pays);

      try {
        afficherStatutAdzuna("Ajout en cours dans Supabase...", "info");
        await insererCandidature({
          poste: offre.poste,
          entreprise: offre.entreprise,
          localisation: offre.localisation || null,
          lien_offre: offre.lien_offre || null,
          statut: "a_postuler",
          notes: offre.description ? offre.description.slice(0, 1000) : null,
          source: "adzuna",
          score_match: qualif.score,
          message_approche: qualif.messageApproche
        });
        afficherStatutAdzuna(`Offre ajoutée : "${offre.poste}" (Score ${qualif.score}/100).`, "ok");
      } catch (err) {
        afficherStatutAdzuna("Erreur ajout Adzuna : " + (err.message || err), "err");
      }
    };

    formAdzuna.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = document.getElementById("adzuna-query").value.trim();
      const country = document.getElementById("adzuna-country").value;

      afficherStatutAdzuna("Recherche en cours sur Adzuna...", "info");
      resultatsAdzunaEl.innerHTML = "";

      try {
        const res = await fetch(`/api/adzuna?q=${encodeURIComponent(q)}&country=${encodeURIComponent(country)}`);
        const data = await res.json();

        if (!res.ok) {
          afficherStatutAdzuna("Erreur Adzuna : " + (data.error || res.status), "err");
          return;
        }

        dernieresOffresAdzuna = data.offres || [];
        afficherStatutAdzuna(`${dernieresOffresAdzuna.length} offre(s) récupérée(s).`, "ok");
        rendreOffresAdzuna(dernieresOffresAdzuna);
      } catch (err) {
        afficherStatutAdzuna("Erreur réseau Adzuna : " + (err.message || err), "err");
      }
    });

    chargerCandidatures();
  </script>
</body>
</html>
