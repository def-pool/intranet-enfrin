<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intranet — Test Ajout Candidature</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; background: #f6f8fa; }
    .card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; background: #0f766e; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #115e59; }
    #message { margin-top: 12px; padding: 10px; border-radius: 4px; display: none; }
    .ok { background: #dcfce7; color: #166534; display: block !important; }
    .err { background: #fee2e2; color: #991b1b; display: block !important; }
    .item { padding: 10px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Suivi des candidatures — Test d'ajout</h1>

  <div class="card">
    <form id="form-candidature">
      <label for="poste">Intitulé du poste *</label>
      <input id="poste" type="text" required placeholder="Ex. Responsable Commercial B2B" />

      <label for="entreprise">Entreprise *</label>
      <input id="entreprise" type="text" required placeholder="Ex. Exemple Industrie" />

      <label for="localisation">Localisation</label>
      <input id="localisation" type="text" placeholder="Ex. France / Itinérant" />

      <label for="lien_offre">Lien de l'offre</label>
      <input id="lien_offre" type="url" placeholder="https://..." />

      <label for="statut">Statut</label>
      <select id="statut">
        <option value="a_postuler">À postuler</option>
        <option value="postule">Postulé</option>
        <option value="relance">Relance</option>
        <option value="entretien">Entretien</option>
      </select>

      <label for="notes">Notes</label>
      <textarea id="notes" rows="3" placeholder="Informations utiles..."></textarea>

      <button type="submit">Enregistrer dans Supabase</button>
    </form>
    <div id="message"></div>
  </div>

  <div class="card">
    <h2>Dernières candidatures enregistrées</h2>
    <div id="liste">Chargement...</div>
  </div>

  <script>
    // 1. REMPLACEZ CES DEUX VALEURS PAR LES VÔTRES DANS SUPABASE :
    const SUPABASE_URL = "COLLEZ_VOTRE_PROJECT_URL_ICI";
    const SUPABASE_ANON_KEY = "COLLEZ_VOTRE_ANON_KEY_ICI";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("form-candidature");
    const msgBox = document.getElementById("message");
    const listeEl = document.getElementById("liste");

    function afficherMessage(texte, estErreur = false) {
      msgBox.textContent = texte;
      msgBox.className = estErreur ? "err" : "ok";
    }

    async function chargerCandidatures() {
      const { data, error } = await supabaseClient
        .from("candidatures")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(10);

      if (error) {
        listeEl.innerHTML = `<p style="color:#991b1b;">Erreur lecture : ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        listeEl.innerHTML = "<p>Aucune candidature enregistrée pour le moment.</p>";
        return;
      }

      listeEl.innerHTML = data.map(row => `
        <div class="item">
          <strong>${row.poste || "(Sans poste)"}</strong> — ${row.entreprise || "(Sans entreprise)"}<br>
          <small>Statut : ${row.statut || "-"} | ${row.localisation || ""}</small>
        </div>
      `).join("");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      afficherMessage("Enregistrement en cours...", false);

      const nouvelleCandidature = {
        poste: document.getElementById("poste").value.trim(),
        entreprise: document.getElementById("entreprise").value.trim(),
        localisation: document.getElementById("localisation").value.trim() || null,
        lien_offre: document.getElementById("lien_offre").value.trim() || null,
        statut: document.getElementById("statut").value,
        notes: document.getElementById("notes").value.trim() || null,
        source: "manuel"
      };

      const { error } = await supabaseClient
        .from("candidatures")
        .insert([nouvelleCandidature]);

      if (error) {
        afficherMessage("Erreur d'enregistrement : " + error.message, true);
        return;
      }

      afficherMessage("Candidature enregistrée avec succès !", false);
      form.reset();
      await chargerCandidatures();
    });

    chargerCandidatures();
  </script>
</body>
</html>
